train:
  _target_: data.AudioDataset
  sample_rate: 44100
  sample_length: 485100 # 11 sec
  out_channels: 'stereo'
  audio_modules:
    musdb18:
      root_dirs: []
      metadata_name: 'metadata'
      inst_list: ['vocals', 'bass', 'drums', 'other']
      ext: 'wav'
      random_shift: true
      aug_mix: true
      aug_volume: true
      aug_flip: true
      aug_ch_shuffle: true
      aug_silence: true
      rate_silence: 0.01
      ensure_non_silent: true
